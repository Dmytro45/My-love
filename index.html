<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff0f4" />
  <title>Наші 2 місяці ♡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div class="sparkle sparkle-one">✧</div>
    <div class="sparkle sparkle-two">♡</div>

    <header class="hero">
      <span class="eyebrow">Щось маленьке для тебе🙄</span>
      <h1>Наші <span>2 місяці</span> ♡</h1>
      <p class="intro">Для моєї найсолодшої киці, яка робить кожен день теплішим.</p>
      <div class="heart" aria-hidden="true">♡</div>
      <p class="hint">Натискай на кнопочки по черзі, сонечко</p>
    </header>

    <section class="message-card" aria-live="polite">
      <div class="counter" id="counter">0 / 10</div>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
      <div id="messages" class="messages">
        <p class="start-note">Тут заховалися 10 маленьких зізнань саме для тебе...</p>
      </div>
      <button id="nextButton" class="love-button" type="button">
        Відкрити перше зізнання <span>♡</span>
      </button>
      <p class="tiny-note" id="tinyNote">Тицяй, моє зайченятко ✨</p>
    </section>

    <footer>З любов’ю, для моєї лапочки ♡</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
